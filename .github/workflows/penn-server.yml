name: Penn server offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  simulated-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-server.txt pytest pytest-asyncio PyYAML
      - run: python -m pytest tests/penn_server -q
