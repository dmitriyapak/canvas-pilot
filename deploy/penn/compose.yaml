name: canvas-pilot-penn
services:
  penn:
    build:
      context: ../..
      dockerfile: deploy/penn/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: 512mb
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 256
    environment:
      PENN_PUBLIC_URL: ${PENN_PUBLIC_URL:?Set dedicated HTTPS origin}
      PENN_PREFIX: ${PENN_PREFIX:?Set random secret prefix}
      PENN_OAUTH_REDIRECTS: ${PENN_OAUTH_REDIRECTS:?Set exact client callback URLs}
      PENN_LOGIN_HOSTS: ${PENN_LOGIN_HOSTS:?Set verified PennKey login hostnames}
      PENN_GMAIL_ADDRESS: ${PENN_GMAIL_ADDRESS:?Set Gmail sender and recipient}
      PENN_EXPECTED_USER_ID: ${PENN_EXPECTED_USER_ID:-}
      # Keep this true throughout testing. No real writes are authorized for tests.
      PENN_TESTING_READ_ONLY: 'true'
    volumes:
      - ./state:/data
      - ./secrets/master_key:/run/secrets/master_key:ro
      - ./secrets/owner_password:/run/secrets/owner_password:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /run/penn-browser:size=512m,uid=10001,gid=10001,mode=0700
      - /home/penn:size=64m,uid=10001,gid=10001,mode=0700
    networks: [penn_proxy]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  penn_proxy:
    external: true
    name: penn_proxy
